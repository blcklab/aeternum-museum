<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AETERNUM — Collection</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.mjs"></script></head>
<body><header class="masthead"><div><p class="eyebrow">BLCK LAB / DIGITAL COLLECTION</p><h1>AETERNUM<span> / Archive</span></h1></div><div class="mast-actions"><a href="./artists.html">Artist encyclopedia</a><button id="fullscreen" type="button" hidden>Fullscreen</button></div></header>
<main><aside class="catalog" aria-label="Collection browser"><label for="search">Find an artwork</label><input id="search" type="search" placeholder="Title, artist, year…"><label for="gallery">Gallery</label><select id="gallery"><option value="">All galleries</option></select><p id="count" class="muted" aria-live="polite"></p><nav id="results" aria-label="Artworks"></nav></aside>
<section class="viewer" aria-label="Selected artwork"><header class="viewerbar"><span id="position" class="muted">Collection</span><div class="controls"><button id="prev" type="button" aria-label="Previous artwork" disabled>←</button><button id="next" type="button" aria-label="Next artwork" disabled>→</button><button id="minus" type="button" aria-label="Zoom out" disabled>−</button><output id="zoom">Fit</output><button id="plus" type="button" aria-label="Zoom in" disabled>+</button><button id="fit" type="button" disabled>Fit</button><button id="actual" type="button" disabled>1:1</button></div></header>
<div id="stage" class="stage" tabindex="0" aria-label="Artwork, scroll or drag to pan when zoomed"><div id="canvas" class="canvas"><img id="painting" alt="" hidden draggable="false"></div><p id="status" role="status">Loading collection…</p></div>
<article class="details"><div><p class="eyebrow" id="room"></p><h2 id="title">Collection</h2><p id="byline" class="muted"></p><p id="description"></p></div><div class="provenance"><p id="resolution"></p><p id="license"></p><p id="credit"></p><a id="source" target="_blank" rel="noopener noreferrer" hidden>View source ↗</a></div></article><section class="artist-preview" id="artist-preview" hidden aria-label="Artist context"><p class="eyebrow">THE ARTIST</p><h2 id="artist-name"></h2><p class="muted" id="artist-era"></p><p id="artist-bio"></p><p id="artist-context"></p><a id="artist-link">Explore artist and related works →</a></section><section class="artist-preview" id="science-preview" hidden aria-label="Scientific context"><p class="eyebrow">ART &amp; SCIENCE</p><h2 id="science-name"></h2><p id="science-copy"></p><a id="science-reference" target="_blank" rel="noopener noreferrer" hidden>Further reading ↗</a><ul id="science-related" class="related-works"></ul></section></section></main></body></html>
